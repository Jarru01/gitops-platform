name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: 5.8.3
  KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
  KUBECONFORM_VERSION: 0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUBERNETES_VERSION: 1.35.8
  # Pinned commits of the schema repositories kubeconform reads.
  K8S_SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/88b0235585da4efb0e4bc6cc00baccf0e327e54d/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/784ec895547a36e548e6810b41f27baade3a0890/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install yamllint==1.38.0
      - run: yamllint --strict .

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c
          tar -xzf kustomize.tar.gz -C bin kustomize
          tar -xzf kubeconform.tar.gz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # CustomResourceDefinitions are skipped: the schema repository has none
      # for them, and the only ones here come unchanged from the Argo CD release.
      - name: kustomize build and kubeconform every kustomization
        run: |
          status=0
          for dir in $(find . -name kustomization.yaml -not -path './.git/*' -exec dirname {} \; | sort); do
            echo "::group::$dir"
            if kustomize build "$dir" | kubeconform -strict -summary -skip CustomResourceDefinition \
                -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location "$K8S_SCHEMAS" -schema-location "$CRD_SCHEMAS"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$dir failed kustomize build or kubeconform"
              status=1
            fi
          done
          exit $status
      - name: kubeconform the root Application
        run: |
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location "$K8S_SCHEMAS" -schema-location "$CRD_SCHEMAS" \
            bootstrap/root-app.yaml

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck scripts/*.sh
