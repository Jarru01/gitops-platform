# Entry point for the local/CI kind cluster, rendered by the root Application
# (bootstrap/root-app.yaml). Sync waves: the platform Applications (-1) must be
# Healthy before Argo CD creates the warehouse Application (wave 0).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform
  - warehouse-dev.yaml
