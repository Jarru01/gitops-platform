# Argo CD, pinned to an upstream release. Apply with server-side apply because
# the upstream CRDs are too large for client-side apply:
#   kubectl apply --server-side --force-conflicts -k bootstrap/argocd
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.2/manifests/install.yaml
patches:
  - path: argocd-cm.yaml
