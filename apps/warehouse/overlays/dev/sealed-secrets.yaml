# Credentials for namespace warehouse-dev, sealed by scripts/seal-secrets.sh with
# bootstrap/sealed-secrets/sealing-key.crt. See README, "Secrets".
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: warehouse-db-credentials
  namespace: warehouse-dev
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: warehouse-db-credentials
      namespace: warehouse-dev
    type: kubernetes.io/basic-auth
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: warehouse-app-secrets
  namespace: warehouse-dev
spec:
  encryptedData:
    WAREHOUSE_RIADITEL_HESLO: 
  template:
    metadata:
      name: warehouse-app-secrets
      namespace: warehouse-dev
