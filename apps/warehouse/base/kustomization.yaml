# Environment-independent part of the warehouse app. Overlays add the
# namespace, the image tag, environment settings and the sealed credentials
# (Secrets warehouse-db-credentials and warehouse-app-secrets).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: warehouse
      app.kubernetes.io/part-of: warehouse-management-app
    includeSelectors: false
resources:
  - database.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: ghcr.io/jarru01/warehouse-management-app
    newTag: latest
# Non-secret settings read by the app's "prod" Spring profile
# (src/main/resources/application-prod.yml in warehouse-management-app).
# The generated name carries a content hash, so a change rolls the Deployment.
configMapGenerator:
  - name: warehouse-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      # Read-write service created by CloudNativePG for the Cluster in database.yaml.
      - DB_URL=jdbc:postgresql://warehouse-db-rw:5432/sklad
      - PUBLIC_URL=http://localhost:8080
      - MAIL_HOST=smtp.invalid
      - MAIL_PORT=587
      - MAIL_SMTP_AUTH=true
      - MAIL_STARTTLS=true
      - MAIL_FROM=Warehouse App <noreply@warehouse.local>
