apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse
  annotations:
    # After the sealed Secrets (-1) and the database (0).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: warehouse
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warehouse
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        # UID/GID of the "warehouse" user baked into the image.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: warehouse
          image: ghcr.io/jarru01/warehouse-management-app
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: warehouse-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: warehouse-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: warehouse-db-credentials
                  key: password
            # Temporary password of the seeded director (changed at first login).
            - name: WAREHOUSE_RIADITEL_HESLO
              valueFrom:
                secretKeyRef:
                  name: warehouse-app-secrets
                  key: WAREHOUSE_RIADITEL_HESLO
          # Spring Boot startup and Flyway migrations take a while on a small node.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness includes the database check (application.yml).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Tomcat and the JVM need a writable temp directory.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
